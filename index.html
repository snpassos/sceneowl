<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SceneOwl</title>
<meta name="description" content="SceneOwl — acompanhe filmes e séries, monte sua watchlist e conecte-se com outras pessoas." />
<style>
  :root {
    color-scheme: dark;
    --bg: #0D0F14;
    --fg: #F5F6F8;
    --muted: #9AA0AC;
    --primary: #6D4AFF;
    --accent: #FFB547;
    --border: rgba(245, 246, 248, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(60% 50% at 50% 0%, #16181f 0%, var(--bg) 70%);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 480px;
    text-align: center;
  }
  .logo {
    width: 92px;
    height: auto;
    margin-bottom: 20px;
    filter: drop-shadow(0 8px 24px rgba(109, 74, 255, 0.35));
  }
  .wordmark {
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }
  .wordmark .scene { color: var(--fg); }
  .wordmark .owl { color: var(--primary); }
  p {
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 22px;
  }
  .lang-toggle {
    display: inline-flex;
    gap: 6px;
    margin-bottom: 22px;
  }
  .lang-toggle button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .lang-toggle button[aria-pressed="true"] {
    background: var(--primary);
    color: var(--fg);
    border-color: var(--primary);
  }
  [data-lang-content][hidden] { display: none; }
  .links {
    display: inline-flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  a.link {
    color: var(--fg);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 13px;
    transition: border-color 0.15s, color 0.15s;
  }
  a.link:hover { border-color: var(--primary); color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./logo.png" alt="SceneOwl" width="230" height="240" />
    <div class="wordmark"><span class="scene">Scene</span><span class="owl">Owl</span></div>

    <div class="lang-toggle" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang-btn="pt-BR" aria-pressed="true">Português</button>
      <button type="button" data-lang-btn="en-US" aria-pressed="false">English</button>
    </div>

    <div data-lang-content="pt-BR">
      <p>Cada cena. Lembrada.<br />Acompanhe filmes e séries, monte sua watchlist e conecte-se com outras pessoas.</p>
      <div class="links">
        <a class="link" href="./privacy-policy.html">Política de Privacidade</a>
        <a class="link" href="./terms-of-service.html">Termos de Uso</a>
      </div>
    </div>

    <div data-lang-content="en-US" hidden>
      <p>Every scene. Remembered.<br />Track movies and TV shows, build your watchlist, and connect with other people.</p>
      <div class="links">
        <a class="link" href="./privacy-policy.html">Privacy Policy</a>
        <a class="link" href="./terms-of-service.html">Terms of Use</a>
      </div>
    </div>
  </div>
  <script>
    // localStorage compartilhado entre index/privacy-policy/terms-of-service (mesmo domínio
    // GitHub Pages) -- escolher o idioma aqui mantém a escolha ao clicar nos links abaixo.
    var STORAGE_KEY = 'sceneowl-lang';
    var buttons = document.querySelectorAll('[data-lang-btn]');
    var contents = document.querySelectorAll('[data-lang-content]');
    function applyLang(lang) {
      buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang-btn') === lang)); });
      contents.forEach(function (c) {
        var match = c.getAttribute('data-lang-content') === lang;
        if (match) { c.removeAttribute('hidden'); } else { c.setAttribute('hidden', ''); }
      });
      document.documentElement.lang = lang;
    }
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var lang = btn.getAttribute('data-lang-btn');
        applyLang(lang);
        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
      });
    });
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) applyLang(saved);
    } catch (e) {}
  </script>
</body>
</html>
